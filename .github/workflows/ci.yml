name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          version: 2026.3.10
          install: true
          cache: true
          experimental: true
      - run: mise run ci
      - name: Upload Web visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-regression
          path: output/playwright/visual-regression/
          if-no-files-found: ignore

  package-smoke:
    name: package-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.0.1
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build:runtime
      - run: npm run test:package -w livetoon-slide
        env:
          SLIDE_PACKAGE_BROWSER: "1"
