name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          version: 2026.3.10
          install: true
          cache: true
          experimental: true
      - run: mise run ci

  package-smoke:
    name: package-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.0.1
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build:runtime
      - run: npm run test:package -w livetoon-slide
        env:
          SLIDE_PACKAGE_BROWSER: "1"

  build-artifacts:
    needs:
      - qa
      - package-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.0.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm run check:release
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - run: npm run build:runtime
      - run: npm run build:template
      - run: mkdir -p artifacts
      - run: npm pack --workspace=livetoon-slide --ignore-scripts --pack-destination artifacts
      - run: shasum -a 256 artifacts/*.tgz artifacts/templates/*.zip > artifacts/SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/*.tgz
            artifacts/templates/*.zip
            artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: artifacts/
          if-no-files-found: error

  publish-npm:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - build-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.0.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm run check:release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm publish --workspace=livetoon-slide

  github-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - build-artifacts
      - publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: artifacts
      - run: gh release create "${GITHUB_REF_NAME}" artifacts/*.tgz artifacts/SHA256SUMS artifacts/templates/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
