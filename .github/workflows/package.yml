name: package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.0.1
          cache: npm
      - run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:runtime
      - run: npm run test:package -w editable-slides-cli
        env:
          SLIDE_PACKAGE_BROWSER: "1"
      - run: mkdir -p artifacts
      - run: npm publish --workspace=editable-slides-cli --dry-run --ignore-scripts
      - run: npm pack --workspace=editable-slides-cli --ignore-scripts --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: editable-slides-cli
          path: artifacts/*.tgz
          if-no-files-found: error
